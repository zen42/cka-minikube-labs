apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: ingress
  labels:
    app: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www/blog
              echo "blog" > /www/index.html
              echo "blog" > /www/blog/index.html
              httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: ingress
spec:
  selector:
    app: blog
  ports:
    - port: 80
      targetPort: 80
