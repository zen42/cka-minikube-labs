apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dns-other
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo "api" > /www/index.html \
                && httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dns-other
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
