apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: pods
  labels:
    app: multi
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "sidecar-token-7f3a" > /shared/status.txt
          while true; do echo "sidecar heartbeat $(date)"; sleep 5; done
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      emptyDir: {}
