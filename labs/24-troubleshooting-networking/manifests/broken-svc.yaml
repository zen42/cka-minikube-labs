apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: ts-net
spec:
  selector: {app: webb}     # typo: pod label is app=web -> no endpoints
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: ts-net
spec:
  selector: {app: api}
  ports:
  - port: 80
    targetPort: 80          # wrong: the container listens on 8080
