apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dns
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo "web" > /www/index.html \
                && httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dns
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
