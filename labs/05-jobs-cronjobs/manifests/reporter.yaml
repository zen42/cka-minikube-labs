apiVersion: batch/v1
kind: CronJob
metadata:
  name: reporter
  namespace: batch
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reporter
              image: busybox:1.36
              command: ["sh", "-c", "date; echo report"]
