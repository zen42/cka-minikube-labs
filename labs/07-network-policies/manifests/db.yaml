apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: netpol
  labels:
    app: db
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /www && echo "db" > /www/index.html \
            && httpd -f -p 80 -h /www
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: netpol
spec:
  selector:
    app: db
  ports:
    - port: 80
      targetPort: 80
