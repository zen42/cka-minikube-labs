apiVersion: v1
kind: Pod
metadata:
  name: sidecar-app
spec:
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "3600"]
  - name: sidecar
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'while true; do echo "ERROR token-7f3a: upstream unreachable"; sleep 5; done'
