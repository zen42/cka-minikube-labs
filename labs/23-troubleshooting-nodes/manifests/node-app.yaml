apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  namespace: ts-nodes
spec:
  replicas: 2
  selector:
    matchLabels: {app: node-app}
  template:
    metadata:
      labels: {app: node-app}
    spec:
      nodeSelector:
        kubernetes.io/hostname: cka-labs-m03
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
