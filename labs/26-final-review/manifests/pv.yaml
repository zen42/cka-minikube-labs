apiVersion: v1
kind: PersistentVolume
metadata:
  name: final-pv
spec:
  capacity: {storage: 500Mi}
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  hostPath: {path: /data/final}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: ["cka-labs"]
