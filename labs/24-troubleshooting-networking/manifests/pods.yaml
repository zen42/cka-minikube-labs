apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: ts-net
  labels: {app: web}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo web-ok > /www/index.html && httpd -f -p 80 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: ts-net
  labels: {app: api}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo api-ok > /www/index.html && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: ts-net
  labels: {app: db}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo db-ok > /www/index.html && httpd -f -p 80 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ts-net
  labels: {app: client}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: other
  namespace: ts-net
  labels: {app: other}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
