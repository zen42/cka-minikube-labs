apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ingress
  labels:
    app: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www/shop
              echo "shop" > /www/index.html
              echo "shop" > /www/shop/index.html
              httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: ingress
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 80
